# T1 · Foundry project (TASKS.md T1). Run from the repo root with make (mk/t1.mk).
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "../deployments" }]

[lint]
lint_on_build = false
